name: Build GOR01 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          unzip -q GOR01-Android-APK-Project.zip
          mkdir -p android/app/src/main/assets
          cp 'gor01/GOR01 Spareparts Inventory - Stok & Keluar Harian.html' android/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle -p android assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOR01-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
